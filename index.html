<!DOCTYPE html>
<!--
  Proiect 10 - Cine este in spatiu? (Who is in Space?)
  Tehnologii Web - 2025/2026
  Echipa:
    - Alina   : CSS styling, dark/light theme, star animation, responsive layout, ISS map modal
    - Nicoleta : JavaScript logic (fetchData, fetchISS, renderTable, toggleSort), Jest tests, backend server.js
-->
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="author" content="Alina, Nicoleta" />
  <meta name="description" content="Dashboard care afiseaza in timp real astronautii aflati in spatiu si pozitia ISS." />
  <title>Space Dashboard</title>

  <!-- Alina: Leaflet CSS pentru harta ISS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    /* =============================================
       Alina: Stiluri generale pentru body
    ============================================= */
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      transition: background 0.3s, color 0.3s;
      overflow-x: hidden;
    }

    /* Alina: Tema intunecata (implicita) */
    body.dark {
      background: #0b0f1a;
      color: white;
    }

    /* Alina: Tema luminoasa */
    body.light {
      background: #f5f5f5;
      color: #111;
    }

    h1 {
      text-align: center;
    }

    /* =============================================
       Alina: Bara de controale (butoane + input)
       Foloseste Flexbox pentru layout responsive
    ============================================= */
    .controls {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    button,
    input[type="text"] {
      padding: 10px;
      border-radius: 5px;
      border: none;
    }

    button {
      background: #1f6feb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1558c0;
    }

    /* =============================================
       Alina: Stiluri tabel astronauti
    ============================================= */
    table {
      margin: auto;
      border-collapse: collapse;
      background: #1e1e1e;
    }

    body.light table {
      background: white;
    }

    th,
    td {
      padding: 10px;
      border: 1px solid #444;
      white-space: nowrap;
    }

    body.light th {
      background: #333;
      color: white;
    }

    body.dark th {
      background: #2c2c2c;
      color: white;
    }

    /* Alina: Header de grup naveta (craft) */
    .craft-header {
      font-weight: bold;
    }

    body.dark .craft-header {
      background: #333;
      color: white;
    }

    body.light .craft-header {
      background: #ddd;
      color: black;
    }

    .info {
      text-align: center;
      margin-bottom: 10px;
    }

    /* =============================================
       Alina: Animatie stele in fundal
    ============================================= */
    .stars {
      position: fixed;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      z-index: -1;
      overflow: hidden;
    }

    .star {
      position: absolute;
      width: 2px;
      height: 2px;
      background: white;
      border-radius: 50%;
      animation: float 6s linear infinite;
      opacity: 0.6;
    }

    @keyframes float {
      from { transform: translateY(0); }
      to   { transform: translateY(-100vh); }
    }

    /* =============================================
       Alina: Modal pentru harta ISS (Leaflet)
    ============================================= */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.8);
      z-index: 10;
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      width: 80%;
      height: 80%;
      background: white;
      border-radius: 10px;
      position: relative;
      overflow: hidden;
    }

    #map {
      width: 100%;
      height: 100%;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      font-size: 26px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      z-index: 9999;
      background: rgba(0, 0, 0, 0.5);
      padding: 5px 10px;
      border-radius: 5px;
      transition: background 0.2s;
      border: none;
    }

    .close-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    /* =============================================
       Alina: Responsive - ecrane mici (sub 600px)
    ============================================= */
    @media (max-width: 600px) {
      .controls {
        flex-direction: column;
      }

      input[type="text"] {
        width: 100%;
      }

      table {
        width: 100%;
      }
    }
  </style>
</head>

<body class="dark">

  <!-- Alina: Container animatie stele -->
  <div class="stars" id="stars"></div>

  <h1>&#128640; Space Dashboard</h1>

  <!-- Nicoleta: Zona de informatii dinamice (populate prin JS) -->
  <p id="count" class="info"></p>
  <p id="extra-info" class="info"></p>
  <p id="iss-location" class="info"></p>

  <!-- Alina: Controale principale -->
  <div class="controls">
    <button onclick="toggleSort()">Sort A-Z / Z-A</button>
    <button onclick="refreshData()">Refresh</button>
    <button onclick="toggleTheme()">Change Theme</button>
    <button onclick="openMap()">See ISS Map</button>
    <input type="text" id="search" placeholder="Search astronaut..." oninput="renderTable()" />
  </div>

  <!-- Nicoleta: Tabelul astronautilor, populat dinamic -->
  <table>
    <thead>
      <tr>
        <th scope="col">Craft</th>
        <th scope="col">Name</th>
      </tr>
    </thead>
    <tbody id="table-body"></tbody>
  </table>

  <!-- Alina: Modal harta ISS -->
  <div class="modal" id="modal" role="dialog" aria-modal="true" aria-label="ISS Map">
    <div class="modal-content">
      <button class="close-btn" onclick="closeMap()" aria-label="Close map">&#10006;</button>
      <div id="map"></div>
    </div>
  </div>

  <!-- Alina: Leaflet JS pentru harta -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <script>
    /*
     * Nicoleta: Variabile globale de stare
     *   - peopleData : lista de astronauti preluata din API
     *   - ascending  : directia sortarii curente
     *   - map        : instanta Leaflet (null pana la prima deschidere)
     *   - marker     : marker-ul ISS pe harta
     */
    let peopleData = [];
    let ascending = true;
    let map = null;
    let marker = null;

    /*
     * Nicoleta: fetchData()
     * Preia datele despre astronauti din backend-ul local (/api/astros)
     * si apeleaza fetchISS() pentru pozitia statiei spatiale.
     * Datele nu sunt stocate local (Cache-Control: no-store pe server).
     */
    function fetchData() {
      fetch("https://space-app-backend-xsb0.onrender.com/api/astros")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          peopleData = data.people;

          document.getElementById("count").innerText =
            "There are " + data.number + " people in space right now.";

          document.getElementById("extra-info").innerText =
            "Last updated: " + new Date().toLocaleTimeString();

          renderTable();
        })
        .catch(function() {
          document.getElementById("count").innerText = "Error: could not reach the API.";
        });

      fetchISS();
    }

    /*
     * Nicoleta: fetchISS()
     * Preia pozitia curenta a ISS (latitudine, longitudine) din /api/iss
     * si actualizeaza textul si marker-ul de pe harta daca aceasta e deschisa.
     */
    function fetchISS() {
      fetch("https://space-app-backend-xsb0.onrender.com/api/iss")
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var lat = data.iss_position.latitude;
          var lon = data.iss_position.longitude;

          document.getElementById("iss-location").innerText =
            "ISS position \u2192 Lat: " + lat + " | Lon: " + lon;

          if (map) {
            map.setView([lat, lon], 3);
            marker.setLatLng([lat, lon]);
          }
        })
        .catch(function() {
          document.getElementById("iss-location").innerText = "ISS position unavailable.";
        });
    }

    /*
     * Nicoleta: renderTable()
     * Filtreaza astronautii dupa textul din campul de cautare,
     * ii sorteaza alfabetic (ascending/descending),
     * ii grupeaza dupa naveta spatiala si populeaza tabelul HTML.
     *
     * Provocari implementate (conform cerintelor):
     *   - Grupare dupa naveta (nu se repeta numele navetei)
     *   - Sortare alfabetica fiabila cu localeCompare (suporta spatii in nume)
     *   - Cautare case-insensitive
     */
    function renderTable() {
      var tbody = document.getElementById("table-body");
      var search = document.getElementById("search").value.toLowerCase();

      tbody.innerHTML = "";

      /* Filtrare dupa numele astronautului (case-insensitive) */
      var filtered = peopleData.filter(function(p) {
        return p.name.toLowerCase().indexOf(search) !== -1;
      });

      /* Sortare alfabetica cu localeCompare (gestioneaza corect spatiile in nume) */
      filtered.sort(function(a, b) {
        return ascending
          ? a.name.localeCompare(b.name)
          : b.name.localeCompare(a.name);
      });

      /* Grupare dupa naveta */
      var grouped = {};
      filtered.forEach(function(p) {
        if (!grouped[p.craft]) grouped[p.craft] = [];
        grouped[p.craft].push(p.name);
      });

      /* Construire randuri tabel */
      for (var craft in grouped) {
        var header = document.createElement("tr");
        header.classList.add("craft-header");
        header.innerHTML =
          "<td colspan=\"2\">" + craft + " (" + grouped[craft].length + ")</td>";
        tbody.appendChild(header);

        grouped[craft].forEach(function(name) {
          var row = document.createElement("tr");
          row.innerHTML = "<td></td><td>" + name + "</td>";
          tbody.appendChild(row);
        });
      }

      /* Mesaj daca nu exista rezultate */
      if (filtered.length === 0) {
        var empty = document.createElement("tr");
        empty.innerHTML = "<td colspan=\"2\">No astronauts found.</td>";
        tbody.appendChild(empty);
      }
    }

    /*
     * Nicoleta: toggleSort()
     * Comuta directia sortarii si re-randeaza tabelul.
     */
    function toggleSort() {
      ascending = !ascending;
      renderTable();
    }

    /*
     * Nicoleta: refreshData()
     * Reincarca datele live din API.
     */
    function refreshData() {
      fetchData();
    }

    /*
     * Alina: toggleTheme()
     * Comuta intre tema dark si tema light pe elementul body.
     */
    function toggleTheme() {
      document.body.classList.toggle("dark");
      document.body.classList.toggle("light");
    }

    /*
     * Alina: openMap()
     * Deschide modalul cu harta Leaflet.
     * Harta este initializata o singura data (lazy init) pentru performanta.
     */
    function openMap() {
      document.getElementById("modal").style.display = "flex";

      if (!map) {
        map = L.map("map").setView([0, 0], 2);

        L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
          attribution: "\u00a9 OpenStreetMap contributors"
        }).addTo(map);

        marker = L.marker([0, 0]).addTo(map);
      }

      fetchISS();
    }

    /*
     * Alina: closeMap()
     * Ascunde modalul cu harta.
     */
    function closeMap() {
      document.getElementById("modal").style.display = "none";
    }

    /*
     * Alina: createStars()
     * Genereaza dinamic 80 de elemente .star pentru animatia de fundal.
     * Pozitia si durata animatiei sunt aleatorii.
     */
    function createStars() {
      var container = document.getElementById("stars");

      for (var i = 0; i < 80; i++) {
        var star = document.createElement("div");
        star.className = "star";
        star.style.left = (Math.random() * 100) + "vw";
        star.style.top  = (Math.random() * 100) + "vh";
        star.style.animationDuration = (3 + Math.random() * 5) + "s";
        container.appendChild(star);
      }
    }

    /* Initializare la incarcarea paginii */
    createStars();
    fetchData();
  </script>

</body>
</html>
